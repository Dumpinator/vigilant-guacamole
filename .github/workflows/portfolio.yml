name: Portfolio CI and Netlify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  # Never interrupt an upload to production; newer pending pushes replace older ones.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portfolio:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: myBook2023/package-lock.json

      - name: Install portfolio dependencies
        working-directory: myBook2023
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build production files
        working-directory: myBook2023
        run: npm run build

      - name: Deploy to Netlify
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" || -z "$NETLIFY_SITE_ID" ]]; then
            echo '::error::Configure the NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets before deploying.'
            exit 1
          fi
          npx --yes netlify-cli@27.17.0 deploy \
            --dir="$GITHUB_WORKSPACE/myBook2023/dist" \
            --site="$NETLIFY_SITE_ID" \
            --message="$GITHUB_SHA" \
            --no-build \
            --prod \
            --context=production \
            --timeout=180
