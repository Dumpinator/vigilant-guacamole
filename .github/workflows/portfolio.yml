name: Portfolio CI and Netlify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  # Never interrupt an upload to production; newer pending pushes replace older ones.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portfolio:
    name: Build, browser checks, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            myBook2023/package-lock.json
            .github/ci/package-lock.json

      - name: Install portfolio dependencies
        working-directory: myBook2023
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Install locked CI tools
        working-directory: .github/ci
        run: npm ci --no-audit --no-fund

      - name: Build production files
        working-directory: myBook2023
        run: npm run build

      - name: Install Chromium
        working-directory: .github/ci
        run: npm exec -- playwright install --with-deps chromium

      - name: Test the production build
        working-directory: .github/ci
        run: npm test

      - name: Keep browser traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-traces-${{ github.run_id }}
          path: .github/ci/test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep the verified build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portfolio-${{ github.sha }}
          path: myBook2023/dist/
          if-no-files-found: error
          retention-days: 3

      - name: Deploy the verified build to Netlify
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" || -z "$NETLIFY_SITE_ID" ]]; then
            echo '::error::Configure the NETLIFY_AUTH_TOKEN repository secret and NETLIFY_SITE_ID repository variable before deploying.'
            exit 1
          fi
          .github/ci/node_modules/.bin/netlify deploy \
            --dir="$GITHUB_WORKSPACE/myBook2023/dist" \
            --site="$NETLIFY_SITE_ID" \
            --message="$GITHUB_SHA" \
            --no-build \
            --prod \
            --context=production \
            --timeout=180
